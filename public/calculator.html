<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>계산기</title>
<style>
  :root {
    --bg: #000;
    --digit: #333333;
    --digit-active: #737373;
    --func: #a5a5a5;
    --func-active: #d9d9d9;
    --op: #ff9f0a;
    --op-active: #fcc78f;
    --text: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    display: flex; align-items: flex-end; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: var(--text); user-select: none; -webkit-user-select: none;
  }
  .calc {
    width: 100%; max-width: 420px; height: 100%; max-height: 900px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 16px 16px max(28px, env(safe-area-inset-bottom));
  }
  .display {
    text-align: right; font-weight: 300; line-height: 1;
    padding: 0 10px 14px; white-space: nowrap; overflow: hidden;
    font-size: 88px; min-height: 100px; display: flex; align-items: flex-end; justify-content: flex-end;
  }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  button {
    appearance: none; border: 0; border-radius: 50%; aspect-ratio: 1;
    font: inherit; font-size: 34px; color: var(--text); background: var(--digit);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .35s ease; padding: 0;
  }
  button:active { background: var(--digit-active); transition: none; }
  button.func { background: var(--func); color: #000; font-size: 30px; }
  button.func:active { background: var(--func-active); transition: none; }
  button.op { background: var(--op); font-size: 44px; padding-bottom: 4px; }
  button.op:active { background: var(--op-active); transition: none; }
  button.op.selected { background: var(--text); color: var(--op); }
  button.zero {
    grid-column: span 2; aspect-ratio: auto; border-radius: 999px;
    justify-content: flex-start; padding-left: 8%;
  }
  @media (max-height: 640px) {
    .display { font-size: 64px; min-height: 72px; }
    button { font-size: 26px; }
    .keys { gap: 8px; }
  }
</style>
</head>
<body>
<main class="calc">
  <div class="display" id="display" aria-live="polite">0</div>
  <div class="keys">
    <button class="func" data-act="clear" id="clear">AC</button>
    <button class="func" data-act="sign">±</button>
    <button class="func" data-act="percent">%</button>
    <button class="op" data-act="op" data-op="/">÷</button>

    <button data-act="digit" data-v="7">7</button>
    <button data-act="digit" data-v="8">8</button>
    <button data-act="digit" data-v="9">9</button>
    <button class="op" data-act="op" data-op="*">×</button>

    <button data-act="digit" data-v="4">4</button>
    <button data-act="digit" data-v="5">5</button>
    <button data-act="digit" data-v="6">6</button>
    <button class="op" data-act="op" data-op="-">−</button>

    <button data-act="digit" data-v="1">1</button>
    <button data-act="digit" data-v="2">2</button>
    <button data-act="digit" data-v="3">3</button>
    <button class="op" data-act="op" data-op="+">+</button>

    <button class="zero" data-act="digit" data-v="0">0</button>
    <button data-act="dot">.</button>
    <button class="op" data-act="equals">=</button>
  </div>
</main>

<script>
(() => {
  const display = document.getElementById('display');
  const clearBtn = document.getElementById('clear');
  const opBtns = [...document.querySelectorAll('button[data-act="op"]')];
  const MAX_DIGITS = 9;

  // 입력 중인 값은 문자열, 계산 결과는 숫자
  let current = '0';       // 화면에 표시 중인 값(문자열)
  let acc = null;          // 누적 값
  let pendingOp = null;    // 대기 중인 연산자
  let lastOp = null, lastOperand = null; // = 반복 입력용
  let typing = true;       // 숫자를 입력하는 중인가
  let error = false;

  const calc = (a, op, b) => {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
    return b;
  };

  function format(str) {
    if (error) return '오류';
    let [int, dec] = str.split('.');
    const neg = int.startsWith('-');
    if (neg) int = int.slice(1);
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + int + (dec !== undefined ? '.' + dec : '');
  }

  function numToStr(n) {
    if (!isFinite(n)) { error = true; return '0'; }
    n = +n.toPrecision(12);              // 부동소수점 오차 제거
    let s = String(n);
    if (/e/i.test(s) || Math.abs(n) >= 1e9) {
      return n.toExponential(5).replace(/\.?0+e/, 'e').replace('e+', 'e');
    }
    // 표시 가능한 자릿수에 맞게 반올림
    const intLen = Math.trunc(Math.abs(n)).toString().length;
    const decimals = Math.max(0, MAX_DIGITS - intLen);
    s = String(+n.toFixed(decimals));
    return s;
  }

  function render() {
    const text = format(current);
    display.textContent = text;
    // 길이에 맞게 글자 크기 축소
    const base = window.matchMedia('(max-height: 640px)').matches ? 64 : 88;
    display.style.fontSize = base + 'px';
    let size = base;
    while (display.scrollWidth > display.clientWidth && size > 28) {
      size -= 2; display.style.fontSize = size + 'px';
    }
    clearBtn.textContent = typing && current !== '0' && !error ? 'C' : 'AC';
    opBtns.forEach(b => b.classList.toggle('selected', justChoseOp && b.dataset.op === pendingOp));
  }

  let justChoseOp = false;

  function inputDigit(d) {
    if (error) return;
    if (!typing) { current = '0'; typing = true; }
    justChoseOp = false;
    if (current === '0' && d !== '.') current = d;
    else if (current.replace(/[-.]/g, '').length < MAX_DIGITS) current += d;
    render();
  }

  function inputDot() {
    if (error) return;
    if (!typing) { current = '0'; typing = true; }
    justChoseOp = false;
    if (!current.includes('.')) current += '.';
    render();
  }

  function chooseOp(op) {
    if (error) return;
    const val = parseFloat(current);
    if (pendingOp && !justChoseOp && acc !== null) {
      acc = calc(acc, pendingOp, val);
      current = numToStr(acc);
    } else if (acc === null || !pendingOp) {
      acc = val;
    }
    pendingOp = op;
    lastOp = null;
    typing = false;
    justChoseOp = true;
    render();
  }

  function equals() {
    if (error) return;
    let val = parseFloat(current);
    if (pendingOp) {
      lastOp = pendingOp;
      lastOperand = justChoseOp ? acc : val;   // 연산자 직후 = 은 자기 자신과 연산
      const result = calc(acc, pendingOp, lastOperand);
      current = numToStr(result);
      acc = null; pendingOp = null;
    } else if (lastOp) {
      // = 반복: 마지막 연산 되풀이
      const result = calc(val, lastOp, lastOperand);
      current = numToStr(result);
    }
    typing = false;
    justChoseOp = false;
    render();
  }

  function clear() {
    if (clearBtn.textContent === 'C' && !error) {
      current = '0'; typing = true;          // C: 현재 입력만 지움
      render();
      return;
    }
    current = '0'; acc = null; pendingOp = null;
    lastOp = lastOperand = null; typing = true; error = false; justChoseOp = false;
    render();
  }

  function toggleSign() {
    if (error) return;
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    if (!typing && acc !== null && !pendingOp) acc = parseFloat(current);
    render();
  }

  function percent() {
    if (error) return;
    const v = parseFloat(current);
    // 덧셈/뺄셈 중에는 누적값의 비율, 그 외에는 /100
    const r = (pendingOp === '+' || pendingOp === '-') && acc !== null ? acc * v / 100 : v / 100;
    current = numToStr(r);
    typing = false;
    justChoseOp = false;
    render();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    switch (b.dataset.act) {
      case 'digit': inputDigit(b.dataset.v); break;
      case 'dot': inputDot(); break;
      case 'op': chooseOp(b.dataset.op); break;
      case 'equals': equals(); break;
      case 'clear': clear(); break;
      case 'sign': toggleSign(); break;
      case 'percent': percent(); break;
    }
  });

  // 키보드 지원
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) inputDigit(k);
    else if (k === '.' || k === ',') inputDot();
    else if (k === '+' || k === '-' || k === '*' || k === '/') { e.preventDefault(); chooseOp(k); }
    else if (k === 'x' || k === 'X') chooseOp('*');
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); }
    else if (k === '%') percent();
    else if (k === 'Escape' || k === 'c' || k === 'C') { clearBtn.textContent = 'AC'; clear(); }
    else if (k === 'Backspace') {
      if (typing && !error) {
        current = current.length > 1 && !(current.length === 2 && current.startsWith('-')) ? current.slice(0, -1) : '0';
        render();
      }
    } else return;
    const target = document.querySelector(`button[data-v="${k}"]`);
    if (target) { target.focus({ preventScroll: true }); target.blur(); }
  });

  window.addEventListener('resize', render);
  render();
})();
</script>
</body>
</html>
