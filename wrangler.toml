# Cloudflare Workers (정적 파일 assets + API)
# 프로젝트 이름은 대시보드의 Worker 이름(sa-capa-siemens)과 같아야 합니다.
name = "sa-capa-siemens"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "se-competency"
# D1 > se-competency 개요 화면의 Database ID 로 교체하세요.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 어드민 비밀번호는 여기에 쓰지 말고 대시보드의 Variables and Secrets 에
# ADMIN_PASSWORD (Secret) 로 등록하세요.
